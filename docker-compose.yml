services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitpro-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=RecruitPro2026Password!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitpro-backend
    ports:
      - "5136:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=RecruitProDb;User Id=sa;Password=RecruitPro2026Password!;TrustServerCertificate=True;
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitpro-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqlserver-data:
