services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitpro
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=change-me-to-a-long-random-string
      - ConnectionStrings__SqliteConnection=Data Source=/data/recruitment.db
      # Optional: enables real AI candidate analysis. Without it the built-in heuristic scorer is used.
      # - OpenAI__ApiKey=sk-...
    volumes:
      - recruitpro-data:/data

volumes:
  recruitpro-data:
