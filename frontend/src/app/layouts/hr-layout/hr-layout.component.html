<div class="layout">
  @if (sidebarOpen()) {
    <div class="overlay" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside class="sidebar" [class.sidebar--open]="sidebarOpen()">
    <div class="sidebar__brand">
      <div class="brand-logo">HR</div>
      <div class="brand-text">
        <span class="brand-name">RecruitPro</span>
        <span class="brand-sub">HR Workspace</span>
      </div>
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="nav-link--active"
          (click)="closeSidebar()"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <div class="user-block">
        <div class="user-avatar">{{ (auth.userDisplayName() || 'H')[0] }}</div>
        <div class="user-info">
          <span class="user-name">{{ auth.userDisplayName() }}</span>
          <span class="user-role">{{ auth.userRole() }}</span>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()">Sign out</button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main">
    <header class="topbar">
      <button class="topbar__menu-btn" (click)="toggleSidebar()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar__brand-mobile">RecruitPro HR</span>
      <div class="topbar__user">
        <span class="topbar__role">{{ auth.userRole() }}</span>
        <div class="topbar__avatar">{{ (auth.userDisplayName() || 'H')[0] }}</div>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
