<div class="candidate-shell">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <a routerLink="/candidate/dashboard" class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">RecruitPro <strong>Candidate</strong></span>
      </a>

      <nav class="candidate-nav">
        <a routerLink="/candidate/dashboard" routerLinkActive="active">Overview</a>
        <a routerLink="/candidate/applications" routerLinkActive="active">My Applications</a>
        <a routerLink="/candidate/interviews" routerLinkActive="active">Interviews</a>
        <a routerLink="/candidate/profile" routerLinkActive="active">Profile & Resume</a>
        <a routerLink="/candidate/settings" routerLinkActive="active">Settings</a>
        <a routerLink="/jobs" class="nav-jobs-btn">Explore Jobs 🔍</a>
      </nav>

      <div class="user-actions">
        <button class="btn-theme" (click)="toggleTheme()" [title]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          {{ isDarkMode() ? '☀️' : '🌙' }}
        </button>
        <div class="user-profile">
          <span class="user-name">{{ auth.userDisplayName() || 'Candidate User' }}</span>
          <span class="user-role">Candidate</span>
        </div>
        <button class="btn-logout" (click)="logout()">Logout</button>
      </div>
    </div>
  </header>

  <!-- Content Outlet -->
  <main class="candidate-main">
    <div class="container py-4">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
