<div class="register-page">
  <div class="register-card">

    <div class="register-card__hero">
      <span class="hero-eyebrow">{{ 'reg.kicker' | t }}</span>
      <h1 class="hero-title">{{ 'reg.title' | t }}</h1>
      <p class="hero-desc">
        {{ 'reg.desc' | t }}
      </p>
      <ul class="hero-features">
        <li><app-icon name="zap" [size]="16" /> {{ 'reg.f1' | t }}</li>
        <li><app-icon name="layers" [size]="16" /> {{ 'reg.f2' | t }}</li>
        <li><app-icon name="calendar" [size]="16" /> {{ 'reg.f3' | t }}</li>
      </ul>
    </div>

    <div class="register-card__form">
      <p class="form-eyebrow">{{ 'reg.form.kicker' | t }}</p>
      <h2 class="form-title">{{ 'reg.form.title' | t }}</h2>
      <p class="form-subtitle">{{ 'reg.form.sub' | t }}</p>

      @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="form" novalidate>
        <div class="row g-3">
          <div class="col-6">
            <label class="field-label">{{ 'reg.first' | t }}</label>
            <input type="text" formControlName="firstName" class="field-input" placeholder="Sarah" />
          </div>

          <div class="col-6">
            <label class="field-label">{{ 'reg.last' | t }}</label>
            <input type="text" formControlName="lastName" class="field-input" placeholder="Connor" />
          </div>
        </div>

        <div class="field mt-3">
          <label class="field-label">{{ 'reg.email' | t }}</label>
          <input type="email" formControlName="email" class="field-input" placeholder="sarah@example.com" />
        </div>

        <div class="field mt-3">
          <label class="field-label">{{ 'reg.password' | t }}</label>
          <input type="password" formControlName="password" class="field-input" placeholder="••••••••" />
        </div>

        <button type="submit" class="btn-submit mt-4" [disabled]="form.invalid || submitting()">
          {{ submitting() ? ('reg.submitting' | t) : ('reg.submit' | t) }} ←
        </button>

        <p class="login-link text-center mt-3">
          {{ 'reg.have' | t }} <a routerLink="/login">{{ 'reg.signin' | t }}</a>
        </p>
      </form>
    </div>

  </div>
</div>
